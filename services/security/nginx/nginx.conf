# security nginx (443). 라우팅 표는 docs/architecture.html "security 라우팅"을 따른다.
#   /, /ws/board   → web:8000      인증 없음
#   /api/session   → 세션 API      인증 없음 (발급 횟수 제한)
#   /m/            → stream:8002   1회용 토큰 → sid 쿠키 발급
#   /ws/stream     → stream:8002   sid 쿠키 확인
#   /auth          → 세션 API      nginx 내부 전용
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # 주소의 ?token=…이 로그에 남지 않도록 쿼리 없이 기록한다
    log_format noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout noquery;
    error_log /dev/stderr warn;

    # Docker 내부 DNS. 서비스 이름을 요청 때마다 찾아서, web·stream이 아직 안 떠 있어도 nginx는 뜬다
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    limit_req_zone $binary_remote_addr zone=session_api:1m rate=2r/s;
    limit_req_status 429;

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers.conf;

        set $web    http://web:8000;
        set $stream http://stream:8002;

        # 인증: 세션 API에 묻고 X-Session-Id·Set-Cookie를 받아 온다
        location = /auth {
            internal;
            proxy_pass http://127.0.0.1:8001/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        error_page 401 = @unauthorized;
        location @unauthorized {
            default_type "text/html; charset=utf-8";
            return 401 '<!doctype html><meta name="viewport" content="width=device-width"><p style="font:18px sans-serif;padding:24px">QR이 만료됐거나 이미 사용됐어요. PC 화면의 새 QR을 다시 찍어 주세요.</p>';
        }

        # ② 세션 발급
        location = /api/session {
            limit_req zone=session_api burst=5 nodelay;
            proxy_pass http://127.0.0.1:8001;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header X-Session-Id "";
        }
        location /api/ { return 404; }

        # ① 휴대폰 카메라 페이지
        location /m/ {
            auth_request /auth;
            auth_request_set $session_id $upstream_http_x_session_id;
            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie always;
            include /etc/nginx/snippets/security-headers.conf;  # add_header를 쓰면 server의 것이 빠지므로 다시 넣는다

            proxy_pass $stream;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header X-Session-Id $session_id;
        }

        # ① 휴대폰 프레임 WebSocket
        location = /ws/stream {
            auth_request /auth;
            auth_request_set $session_id $upstream_http_x_session_id;

            proxy_pass $stream;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header X-Session-Id $session_id;
        }

        # web 내부 전용 (⑥ gesture → web, ⑧ stream → web): 바깥에서 부르면 남의 화면에 그릴 수 있다
        # commands는 ⑥의 예전 이름. web이 아직 그 이름을 쓰고 있어도 바깥에 열리지 않게 같이 막는다
        location ~ ^/(actions|commands|events)(/|$) { return 404; }

        # ②⑦ PC 그림판 페이지와 명령 WebSocket
        location / {
            proxy_pass $web;
            include /etc/nginx/snippets/proxy-common.conf;
            proxy_set_header X-Session-Id "";
        }
    }
}
