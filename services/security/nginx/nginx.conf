# security nginx. 경로별 라우팅은 snippets/routes.conf.
#   443  : 휴대폰·PC 브라우저 (HTTPS)
#   80   : PC 자신(http://localhost)은 경고 없이 그대로 쓰고, 그 밖은 443으로 넘긴다.
user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # 주소의 ?token=…이 로그에 남지 않도록 쿼리 없이 기록한다
    log_format noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout noquery;
    error_log /dev/stderr warn;

    # Docker 내부 DNS. 서비스 이름을 요청 때마다 찾아서, web·stream이 아직 안 떠 있어도 nginx는 뜬다
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    limit_req_zone $binary_remote_addr zone=session_api:1m rate=2r/s;
    limit_req_status 429;

    server {
        listen 80 default_server;
        location / { return 301 https://$host$request_uri; }
    }

    # PC 브라우저 전용: http://localhost. 이 PC 안에서만 오가므로 인증서 없이 연다.
    # 휴대폰 카메라 페이지(/m/)는 계속 HTTPS로만 쓴다 (QR 주소가 https://<PC IP>).
    server {
        listen 80;
        server_name localhost 127.0.0.1;
        include /etc/nginx/snippets/routes.conf;
    }

    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/snippets/routes.conf;
    }
}
