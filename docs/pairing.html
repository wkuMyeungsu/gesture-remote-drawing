<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR 연결 과정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 팀 문서(docs/architecture.html)처럼 흰 종이 + 검은 선. 위는 무대(도해), 아래는 자막과 재생 막대 */
:root {
  --bg: #e8ecef; --paper: #ffffff; --ink: #14191e; --muted: #5b6670; --thin: #bcc4cb; --wash: #f1f4f6;
  --sid: #1d6fb8; --token: #b06800; --key: #7b3fb3; --ok: #2b8a3e; --bad: #c92a2a;
  --screen: #1b2229; --screen-ink: #e9eef2; --screen-dim: #3a4651;
  --f-ui: "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1317; --paper: #171d23; --ink: #e4e9ed; --muted: #97a2ac; --thin: #3a444d; --wash: #1f262d;
    --sid: #63a9ec; --token: #efa43a; --key: #b48ae6; --ok: #5cc278; --bad: #ff6b6b;
    --screen: #0a0e12; --screen-ink: #e9eef2; --screen-dim: #2a333c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1317; --paper: #171d23; --ink: #e4e9ed; --muted: #97a2ac; --thin: #3a444d; --wash: #1f262d;
  --sid: #63a9ec; --token: #efa43a; --key: #b48ae6; --ok: #5cc278; --bad: #ff6b6b;
  --screen: #0a0e12; --screen-ink: #e9eef2; --screen-dim: #2a333c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.doc { max-width: 1000px; margin: 0 auto; background: var(--paper); border: 2px solid var(--ink); }
header { padding: 18px 22px 12px; border-bottom: 2px solid var(--ink); }
h1 { margin: 0; font-size: 24px; line-height: 1.3; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); }
code, .mono { font-family: var(--f-mono); font-size: .9em; }

.stage { overflow-x: auto; background: var(--wash); border-bottom: 2px solid var(--ink); }
.stage svg { display: block; width: 100%; min-width: 760px; height: auto; }

/* ── 도해 ── */
svg text { font-family: var(--f-ui); fill: var(--ink); }
svg .n { font-weight: 700; font-size: 15px; }
svg .t { font-size: 12px; fill: var(--muted); }
svg .m { font-family: var(--f-mono); font-size: 12.5px; }
svg .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
svg .cont { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
svg .ext { fill: var(--paper); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
svg .road { fill: none; stroke: var(--thin); stroke-width: 2; stroke-linejoin: round; }
svg .scr { fill: var(--wash); stroke: var(--thin); }
svg .ring { fill: none; stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; opacity: 0; transition: opacity .2s; }
svg .ring.on { opacity: 1; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -24; } }
svg .idle { opacity: .4; transition: opacity .3s; }
svg .hl { fill: var(--wash); stroke-width: 2; opacity: 0; }
svg .hl.on { opacity: 1; }
svg .hl-sid { stroke: var(--sid); } svg .hl-token { stroke: var(--token); } svg .hl-key { stroke: var(--key); }
svg .c-sid { fill: var(--sid); } svg .c-token { fill: var(--token); } svg .c-key { fill: var(--key); }
svg .c-ink { fill: var(--ink); } svg .c-ok { fill: var(--ok); } svg .c-bad { fill: var(--bad); } svg .c-muted { fill: var(--muted); }
svg .halo { stroke: var(--wash); stroke-width: 5px; stroke-linejoin: round; paint-order: stroke; }
svg .halo-p { stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; paint-order: stroke; }
svg .pkt circle { stroke: var(--paper); stroke-width: 2.5; }
svg .pkt text { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; }
svg .tunnel { fill: none; stroke: var(--ok); stroke-width: 10; stroke-linejoin: round; opacity: .22; }
svg .tunnel-core { fill: none; stroke: var(--ok); stroke-width: 2; stroke-dasharray: 2 6; stroke-linejoin: round; }
svg .scan { stroke: var(--token); stroke-width: 2; stroke-dasharray: 5 5; fill: none; }
svg .phone-body { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
svg .phone-scr { fill: var(--screen); }
svg .on-scr { fill: var(--screen-ink); }
svg .scr-dim { fill: var(--screen-dim); }
svg .qr-m { fill: var(--ink); }
svg .stroke-draw { fill: none; stroke: var(--sid); stroke-width: 3.5; stroke-linecap: round; }
svg .strike { stroke: var(--bad); stroke-width: 2; }
svg .stamp rect { fill: var(--paper); stroke: var(--bad); stroke-width: 2; }
svg .stamp text { fill: var(--bad); font-weight: 700; font-size: 14px; }
svg .rec { fill: var(--bad); }

/* ── 자막 ── */
.caption { padding: 16px 22px 6px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }
.badge { grid-row: span 2; font: 700 13px/1 var(--f-mono); padding: 7px 9px; border: 2px solid var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.step-title { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.45; text-wrap: balance; min-width: 0; }
.beat { margin: 0; color: var(--muted); min-height: 3.3em; min-width: 0; max-width: 68ch; }

/* ── 재생 막대 ── */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 22px 14px; }
button {
  font: 600 14px/1 var(--f-ui); color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); padding: 8px 12px; cursor: pointer; min-height: 38px;
}
button:hover { background: var(--wash); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sid); outline-offset: 2px; }
button.primary { background: var(--ink); color: var(--paper); min-width: 112px; }
button.primary:hover { opacity: .9; }
.scrub { flex: 1 1 220px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.scrub input { flex: 1; min-width: 0; accent-color: var(--ink); }
.time { font: 13px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.speed { display: flex; }
.speed button { padding: 8px 9px; font: 500 13px/1 var(--f-mono); }
.speed button + button { border-left-width: 0; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.chips { list-style: none; margin: 0; padding: 0 22px 18px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.chips button { width: 100%; text-align: left; padding: 9px 10px 11px; position: relative; font-weight: 500; line-height: 1.35; overflow: hidden; }
.chips .num { font: 700 12px var(--f-mono); display: block; color: var(--muted); margin-bottom: 2px; }
.chips .fill { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ink); width: 0; }
.chips button[aria-current="step"] { background: var(--wash); }
.chips button[aria-current="step"] .num { color: var(--ink); }

footer { border-top: 2px solid var(--ink); padding: 12px 22px; color: var(--muted); font-size: 13px; }
footer p { margin: 0; }

@media (max-width: 640px) {
  body { padding-block: 0 24px; }
  .doc { border-width: 0 0 2px; }
  header, .caption, .controls, footer { padding-left: 0; padding-right: 0; }
  .chips { grid-template-columns: repeat(2, 1fr); padding-left: 0; padding-right: 0; }
  .step-title { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  svg .ring.on { animation: none; }
}
</style>
</head>
<body>

<div class="doc">
  <header>
    <h1>QR 연결 과정</h1>
    <p class="sub">휴대폰이 처음 연결될 때 security 안에서 벌어지는 일 · 재생하거나 단계를 눌러 보세요</p>
  </header>

  <div class="stage">
    <svg id="svg" viewBox="0 0 960 520" role="img" aria-label="PC 브라우저와 휴대폰이 security(nginx, 세션 API)를 거쳐 stream에 연결되는 과정">
      <!-- 색 읽는 법 -->
      <g>
        <text class="t" x="344" y="30">색 읽는 법</text>
        <circle class="c-sid" cx="352" cy="52" r="6"/>
        <text x="366" y="57"><tspan class="m c-sid" font-weight="500">sid</tspan><tspan class="t" dx="8">세션 번호 · PC와 휴대폰을 한 쌍으로 묶음</tspan></text>
        <circle class="c-token" cx="352" cy="78" r="6"/>
        <text x="366" y="83"><tspan class="m c-token" font-weight="500">token</tspan><tspan class="t" dx="8">QR 속 1회용 입장권 · 60초</tspan></text>
        <circle class="c-key" cx="352" cy="104" r="6"/>
        <text x="366" y="109"><tspan class="m c-key" font-weight="500">phone_key</tspan><tspan class="t" dx="8">휴대폰 쿠키에 담기는 비밀값 · 3시간</tspan></text>
      </g>

      <!-- 길 -->
      <path class="road" d="M254 100H296V200H350"/>
      <path class="road" d="M212 400H318V248H350"/>
      <path class="road" d="M450 262V324M530 324V262"/>
      <path class="road" d="M630 248H730"/>
      <path class="road" d="M833 262V300" stroke-dasharray="4 4"/>

      <!-- security 컨테이너 -->
      <rect class="cont" x="330" y="144" width="320" height="368" rx="6"/>
      <text class="t" x="344" y="166" font-weight="600">security 컨테이너 · 정문</text>

      <!-- PC -->
      <rect class="ring" id="ring-pc" x="16" y="12" width="246" height="216" rx="8"/>
      <rect class="box" x="24" y="20" width="230" height="200" rx="4"/>
      <text class="n" x="38" y="40">PC 브라우저</text>
      <text class="t" x="240" y="40" text-anchor="end">그림판</text>
      <rect class="scr" x="38" y="48" width="202" height="158"/>
      <text id="pc-wait" class="t" x="139" y="132" text-anchor="middle">세션 받기 전</text>
      <text id="pc-sid" x="50" y="68" display="none"><tspan class="t">sid</tspan><tspan class="m c-sid" dx="6">5f0c2a9e-…</tspan></text>
      <g id="pc-qr" display="none">
        <g id="qr" transform="translate(97 76)"></g>
        <text x="139" y="178" text-anchor="middle"><tspan class="t">token</tspan><tspan class="m c-token" dx="6">q8Zr3kLm</tspan></text>
        <text class="t" x="139" y="196" text-anchor="middle">60초 안에 한 번만</text>
        <g id="pc-stamp" class="stamp" transform="translate(139 118) rotate(-12)" display="none">
          <rect x="-44" y="-15" width="88" height="30"/>
          <text x="0" y="5" text-anchor="middle">사용됨</text>
        </g>
      </g>
      <g id="pc-conn" display="none">
        <circle class="c-ok" cx="56" cy="92" r="5"/>
        <text x="68" y="97" font-weight="600" font-size="14">휴대폰 연결됨</text>
        <path id="pc-draw" class="stroke-draw" d="M62 182C84 128 112 196 140 150S196 116 220 168"/>
      </g>

      <!-- 휴대폰 -->
      <rect class="ring" id="ring-phone" x="76" y="282" width="144" height="230" rx="22"/>
      <rect class="phone-body" x="84" y="290" width="128" height="214" rx="18"/>
      <text class="n" x="148" y="307" text-anchor="middle" font-size="12">휴대폰</text>
      <rect class="phone-scr" x="94" y="314" width="108" height="170" rx="4"/>
      <g id="ph-idle"><text class="on-scr" x="148" y="404" text-anchor="middle" font-size="12">카메라</text></g>
      <g id="ph-scan" display="none">
        <path d="M118 356v-10h10M178 356v-10h-10M118 416v10h10M178 416v10h-10" stroke="var(--token)" stroke-width="2.5" fill="none"/>
        <rect class="scr-dim" x="128" y="356" width="40" height="60"/>
        <text class="on-scr" x="148" y="452" text-anchor="middle" font-size="12">QR 인식</text>
      </g>
      <g id="ph-load" display="none"><text class="on-scr" x="148" y="404" text-anchor="middle" font-size="12">접속 중…</text></g>
      <g id="ph-cam" display="none">
        <rect class="scr-dim" x="100" y="322" width="96" height="118" rx="2"/>
        <text class="on-scr" x="148" y="384" text-anchor="middle" font-size="11">카메라 페이지</text>
        <rect id="ph-btn" x="104" y="450" width="88" height="26" rx="13" fill="var(--screen-ink)"/>
        <text id="ph-btn-t" x="148" y="467" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--screen)">촬영 시작</text>
      </g>
      <g id="ph-live" display="none">
        <circle class="rec" cx="106" cy="332" r="4"/>
        <text class="on-scr" x="114" y="336" font-size="10.5">촬영 중</text>
        <text id="ph-count" class="on-scr" x="148" y="472" text-anchor="middle" font-size="11" font-family="var(--f-mono)">보낸 프레임 0</text>
      </g>

      <!-- 휴대폰 쿠키 -->
      <g id="cookie" display="none">
        <rect x="220" y="428" width="102" height="62" rx="4" fill="var(--paper)" stroke="var(--key)" stroke-width="2"/>
        <text class="t" x="230" y="446" font-weight="600">쿠키 · 3시간</text>
        <text class="m c-key" x="230" y="464">Kx9fT2pQ…</text>
        <text class="t" x="230" y="481" font-size="11">phone_key</text>
      </g>

      <!-- 통로 -->
      <g id="tunnel" display="none">
        <path class="tunnel" d="M212 400H318V248H730"/>
        <path class="tunnel-core" d="M212 400H318V248H730"/>
      </g>

      <!-- nginx -->
      <rect class="ring" id="ring-nginx" x="342" y="172" width="296" height="98" rx="6"/>
      <g id="nginx-g">
        <rect class="box" x="350" y="180" width="280" height="82" rx="4" fill-opacity=".92"/>
        <text class="n" x="366" y="204">nginx</text>
        <text class="t" x="420" y="204">HTTPS 443</text>
        <text class="t" x="366" y="224">출입구 · 길 안내 · 들여보내기 전에 검사</text>
      </g>

      <!-- 세션 API -->
      <rect class="ring" id="ring-api" x="342" y="316" width="296" height="192" rx="6"/>
      <g id="api-g">
        <rect class="box" x="350" y="324" width="280" height="176" rx="4"/>
        <text class="n" x="366" y="348">세션 API</text>
        <text class="t" x="366" y="366">출입증 담당 · 저장소</text>
        <rect id="hl-sid" class="hl hl-sid" x="358" y="374" width="264" height="26" rx="3"/>
        <rect id="hl-token" class="hl hl-token" x="358" y="402" width="264" height="26" rx="3"/>
        <rect id="hl-key" class="hl hl-key" x="358" y="430" width="264" height="26" rx="3"/>
        <text class="m c-muted" x="366" y="392">sid</text>
        <text class="m c-muted" x="366" y="420">token</text>
        <text class="m c-muted" x="366" y="448">phone_key</text>
        <text id="v-sid" class="m c-sid" x="458" y="392" display="none">5f0c2a9e-…</text>
        <text id="v-token" class="m c-token" x="458" y="420" display="none">q8Zr3kLm</text>
        <text id="v-token-ttl" class="t" x="534" y="420" display="none">60초</text>
        <line id="v-token-x" class="strike" x1="455" y1="416" x2="524" y2="416" display="none"/>
        <text id="v-token-dead" class="c-bad" x="534" y="420" font-size="12" font-weight="700" display="none">폐기됨</text>
        <text id="v-key" class="m c-key" x="458" y="448" display="none">Kx9fT2pQ…</text>
        <text id="v-empty" class="t" x="458" y="420">비어 있음</text>
        <text id="api-note" class="t" x="366" y="484">메모리에 저장 · 재시작하면 사라짐</text>
      </g>

      <!-- stream -->
      <rect class="ring" id="ring-stream" x="722" y="172" width="222" height="98" rx="6"/>
      <rect class="box" x="730" y="180" width="206" height="82" rx="4" fill-opacity=".92"/>
      <text class="n" x="746" y="204">stream</text>
      <text class="t" x="746" y="224">카메라 페이지 · 프레임 받기</text>
      <rect id="vision" class="ext" x="730" y="300" width="206" height="58" rx="4"/>
      <text x="746" y="325" font-weight="600" font-size="13">vision → gesture → web</text>
      <text class="t" x="746" y="345">손을 찾아 그림판으로</text>

      <!-- QR 스캔 빛 -->
      <path id="scan" class="scan" d="M148 290L139 160" display="none"/>

      <!-- 움직이는 패킷 -->
      <g id="packets"></g>
    </svg>
  </div>

  <section class="caption" aria-live="polite">
    <span class="badge" id="badge">1 / 5</span>
    <p class="step-title" id="step-title"></p>
    <p class="beat" id="beat"></p>
  </section>

  <div class="controls">
    <button type="button" class="primary" id="play">▶ 재생</button>
    <button type="button" id="prev" aria-label="이전 단계">◀ 이전</button>
    <button type="button" id="next" aria-label="다음 단계">다음 ▶</button>
    <div class="scrub">
      <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="재생 위치">
      <span class="time" id="time">0.0 / 0.0초</span>
    </div>
    <div class="speed" role="group" aria-label="재생 속도">
      <button type="button" data-speed="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-speed="1" aria-pressed="true">1×</button>
      <button type="button" data-speed="2" aria-pressed="false">2×</button>
    </div>
  </div>

  <ol class="chips" id="chips"></ol>

  <footer>
    <p>코드 위치: <code>services/security/app/store.py</code> (토큰·phone_key) · <code>app/main.py</code> (<code>/auth</code>) · <code>nginx/snippets/routes.conf</code> (auth_request). sid·token·phone_key 값은 예시입니다. 단축키: Space 재생/정지, ←/→ 단계 이동.</p>
  </footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const show = (el, on) => el.setAttribute('display', on ? 'inline' : 'none');

  // ── 길 (도해 좌표) ─────────────────────────────
  const R = {
    pc:    [[254, 100], [296, 100], [296, 200], [350, 200]],
    ngApi: [[450, 262], [450, 324]],
    apiNg: [[530, 324], [530, 262]],
    phone: [[212, 400], [318, 400], [318, 248], [350, 248]],
    ngSt:  [[630, 248], [730, 248]],
    tun:   [[212, 400], [318, 400], [318, 248], [730, 248]],
  };

  // ── 대본 ──────────────────────────────────────
  // beat: d 길이(초), cap 자막, move 움직이는 패킷, glow 강조할 상자, hl 강조할 저장소 줄,
  //       pre 시작할 때 바뀌는 상태, post 끝날 때 바뀌는 상태
  const STEPS = [
    { name: '세션 발급', title: 'PC가 security 서버에 요청하면 서버가 sid와 1회용 토큰을 만든다.', beats: [
      { d: 1.6, cap: 'PC 그림판이 security에 세션을 요청합니다.', glow: ['pc'], move: { r: 'pc', label: 'POST /api/session', c: 'ink' } },
      { d: 1.1, cap: 'nginx가 이 요청을 세션 API로 넘깁니다.', glow: ['nginx'], move: { r: 'ngApi', label: '세션 발급 요청', c: 'ink' } },
      { d: 2.2, cap: '세션 API가 sid(세션 번호)와 1회용 토큰을 만들어 저장합니다.', glow: ['api'], hl: ['sid', 'token'], pre: { sid: true, token: 'live' } },
      { d: 1.1, cap: '만든 값을 nginx에 돌려줍니다.', move: { r: 'apiNg', label: '{ sid, token }', c: 'sid' } },
      { d: 1.8, cap: 'PC는 sid와, 토큰이 담긴 접속 주소(pair_url)를 받습니다.', move: { r: 'pc', rev: true, label: '{ sid, pair_url }', c: 'sid' }, post: { pcSid: true } },
    ] },
    { name: 'QR 표시', title: 'PC는 토큰이 담긴 주소를 QR로 보여준다.', beats: [
      { d: 2.0, cap: 'PC가 접속 주소를 QR로 그립니다. 주소 끝에 ?token=q8Zr3kLm이 붙어 있습니다.', glow: ['pc'], pre: { qr: 'show' }, qrDraw: true },
      { d: 2.0, cap: '이 토큰은 60초 안에, 딱 한 번만 쓸 수 있습니다.', glow: ['pc'], hl: ['token'] },
      { d: 2.0, cap: '휴대폰 카메라로 PC 화면의 QR을 찍습니다.', glow: ['phone'], pre: { phone: 'scan' }, scan: true },
    ] },
    { name: '토큰 → 쿠키', title: '휴대폰이 QR을 찍어 접속하면, security가 토큰을 확인한 뒤 폐기하고 휴대폰에 쿠키를 준다.', beats: [
      { d: 1.8, cap: '휴대폰이 QR 속 주소로 접속합니다. 주소에 토큰이 들어 있습니다.', pre: { phone: 'load' }, move: { r: 'phone', label: 'GET /m/?token=q8Zr…', c: 'token' } },
      { d: 1.5, cap: 'nginx는 바로 들여보내지 않고, 세션 API에 먼저 확인을 맡깁니다 (auth_request).', glow: ['nginx'] },
      { d: 1.1, cap: '토큰을 세션 API로 보내 확인합니다.', glow: ['nginx'], move: { r: 'ngApi', label: '토큰 확인', c: 'token' } },
      { d: 2.2, cap: '맞는 토큰입니다. 세션 API는 확인하자마자 토큰을 폐기합니다. 같은 QR은 다시 쓸 수 없습니다.', glow: ['api'], hl: ['token'], pre: { token: 'dead' } },
      { d: 2.4, cap: '대신 휴대폰 전용 비밀값 phone_key를 새로 만듭니다. sid와 다른 값이라, sid를 아는 PC 쪽이 휴대폰인 척할 수 없습니다.', glow: ['api'], hl: ['key'], pre: { key: true } },
      { d: 1.1, cap: '통과 결과와 쿠키를 nginx에 돌려줍니다.', move: { r: 'apiNg', label: '통과 + 쿠키', c: 'key' } },
      { d: 1.1, cap: 'nginx가 stream에서 카메라 페이지를 받아 옵니다.', glow: ['stream'], move: { r: 'ngSt', label: 'GET /m/', c: 'ink' } },
      { d: 1.0, cap: 'stream이 카메라 페이지를 돌려줍니다.', move: { r: 'ngSt', rev: true, label: 'camera.html', c: 'ink' } },
      { d: 2.0, cap: '휴대폰은 카메라 페이지와 함께 쿠키를 받습니다. 쿠키 안에는 phone_key가 들어 있고 3시간 동안 쓸 수 있습니다.', move: { r: 'phone', rev: true, label: '카메라 페이지 + 쿠키', c: 'key' }, post: { cookie: true, phone: 'cam', qr: 'used' } },
      { d: 1.8, cap: 'PC 화면의 QR은 이제 쓸 수 없습니다. 토큰이 이미 폐기됐기 때문입니다.', glow: ['pc'] },
    ] },
    { name: '통로 열기', title: '휴대폰이 영상 통로를 열 때 nginx가 쿠키를 확인한다. 통과하면 그 쿠키에 해당하는 sid를 찾아 붙여서 stream으로 연결해 준다.', beats: [
      { d: 1.3, cap: '사용자가 휴대폰에서 촬영 시작을 누릅니다.', glow: ['phone'], pre: { phone: 'start' } },
      { d: 1.9, cap: '휴대폰이 영상 통로(WebSocket /ws/stream)를 엽니다. 쿠키는 브라우저가 알아서 함께 보냅니다.', move: { r: 'phone', label: '/ws/stream + 쿠키', c: 'key' } },
      { d: 1.1, cap: 'nginx가 쿠키를 세션 API로 보내 확인합니다.', glow: ['nginx'], move: { r: 'ngApi', label: '쿠키 확인', c: 'key' } },
      { d: 2.4, cap: '세션 API가 쿠키 속 phone_key로 저장소를 찾아, 짝이 되는 sid를 알아냅니다.', glow: ['api'], hl: ['key', 'sid'] },
      { d: 1.1, cap: '통과입니다. 찾은 sid를 nginx에 알려 줍니다.', move: { r: 'apiNg', label: 'X-Session-Id: 5f0c…', c: 'sid' } },
      { d: 2.0, cap: 'nginx가 sid 이름표(X-Session-Id)를 직접 붙여 stream으로 연결합니다. 휴대폰이 같은 이름표를 지어 와도 nginx가 덮어씁니다.', glow: ['nginx'], move: { r: 'ngSt', label: 'X-Session-Id: 5f0c…', c: 'sid' } },
      { d: 2.4, cap: '휴대폰과 stream 사이에 통로가 열렸습니다. stream이 web에 알려 PC 화면도 “휴대폰 연결됨”으로 바뀝니다.', glow: ['stream', 'pc'], pre: { tunnel: true, phone: 'live', pcConn: true } },
    ] },
    { name: '프레임 전송', title: '프레임은 이 통로로 계속 보낸다.', beats: [
      { d: 8.5, cap: '프레임은 이미 열린 통로로 흐르고, nginx는 프레임마다 다시 검사하지 않습니다. stream이 받았다는 ack를 돌려주면 휴대폰이 다음 프레임을 보냅니다.', frames: true, pre: { apiIdle: true } },
      { d: 2.4, cap: '연결이 끝났습니다. 이후 프레임은 stream → vision → gesture → web을 거쳐 PC 그림판에 그려집니다.' },
    ] },
  ];

  const INIT = { pcSid: false, qr: 'none', sid: false, token: 'none', key: false, phone: 'idle',
                 cookie: false, tunnel: false, pcConn: false, apiIdle: false };
  const FRAME = { period: 1.7, travel: 1.0, ack: 0.6 };

  // 절대 시각 매기기
  const BEATS = [];
  let total = 0;
  STEPS.forEach((s, si) => {
    s.t0 = total;
    for (const b of s.beats) { b.step = si; b.t0 = total; total += b.d; b.t1 = total; BEATS.push(b); }
    s.t1 = total;
  });
  const TOTAL = total;
  const FRAMES_BEAT = BEATS.find((b) => b.frames);
  const MAX_FRAMES = Math.ceil(FRAMES_BEAT.d / FRAME.period);

  // ── 길 위의 위치 ─────────────────────────────
  function along(pts, p) {
    const segs = [];
    let len = 0;
    for (let i = 1; i < pts.length; i++) {
      const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      segs.push(l); len += l;
    }
    let d = Math.max(0, Math.min(1, p)) * len;
    for (let i = 0; i < segs.length; i++) {
      if (d <= segs[i] || i === segs.length - 1) {
        const k = segs[i] ? d / segs[i] : 0;
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
        return { x: x0 + (x1 - x0) * k, y: y0 + (y1 - y0) * k, vertical: x0 === x1 };
      }
      d -= segs[i];
    }
  }
  const ease = (p) => (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
  const route = (m) => (m.rev ? [...R[m.r]].reverse() : R[m.r]);

  // ── QR 무늬 (보기용) ─────────────────────────
  const qrEls = [];
  (function buildQr() {
    const N = 21, S = 4;
    let seed = 1337;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const finder = (x, y, ox, oy) => {
      const dx = x - ox, dy = y - oy;
      if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
      return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
    };
    const cells = [];
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let on = finder(x, y, 0, 0);
      if (on === null) on = finder(x, y, 14, 0);
      if (on === null) on = finder(x, y, 0, 14);
      if (on === null) {
        const sep = (x <= 7 && y <= 7) || (x >= 13 && y <= 7) || (x <= 7 && y >= 13);
        on = sep ? false : (y === 6 || x === 6) ? (x + y) % 2 === 0 : rnd() < 0.48;
      }
      if (on) cells.push([x, y]);
    }
    cells.sort((a, b) => a[0] + a[1] - (b[0] + b[1]));
    const g = $('qr');
    for (const [x, y] of cells) {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('class', 'qr-m');
      r.setAttribute('x', x * S); r.setAttribute('y', y * S);
      r.setAttribute('width', S); r.setAttribute('height', S);
      g.appendChild(r); qrEls.push(r);
    }
  })();

  // ── 패킷 ─────────────────────────────────────
  const pool = [];
  for (let i = 0; i < 3; i++) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'pkt');
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 7);
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'halo');
    g.append(c, t);
    $('packets').appendChild(g);
    pool.push({ g, c, t });
  }
  function packet(i, pts, p, label, color) {
    const k = pool[i], pos = along(pts, p);
    k.g.setAttribute('display', 'inline');
    k.c.setAttribute('cx', pos.x); k.c.setAttribute('cy', pos.y);
    k.c.setAttribute('class', 'c-' + color);
    k.t.setAttribute('class', 'halo c-' + color);
    k.t.textContent = label;
    if (pos.vertical) {
      k.t.setAttribute('x', pos.x + 13); k.t.setAttribute('y', pos.y + 4); k.t.setAttribute('text-anchor', 'start');
    } else {
      k.t.setAttribute('x', pos.x); k.t.setAttribute('y', pos.y - 13); k.t.setAttribute('text-anchor', 'middle');
    }
  }

  // ── 상태 계산 ────────────────────────────────
  function stateAt(t) {
    const s = { ...INIT };
    let active = BEATS[BEATS.length - 1];
    for (const b of BEATS) {
      if (t >= b.t0 && b.pre) Object.assign(s, b.pre);
      if (t >= b.t1 && b.post) Object.assign(s, b.post);
      if (t >= b.t0 && t < b.t1) active = b;
    }
    return { s, b: active, p: Math.min(1, (t - active.t0) / active.d) };
  }

  const drawPath = $('pc-draw');
  const drawLen = drawPath.getTotalLength();
  drawPath.style.strokeDasharray = drawLen;

  let lastBeat = null;
  function render(t) {
    const { s, b, p } = stateAt(t);

    // PC
    show($('pc-wait'), !s.pcSid);
    show($('pc-sid'), s.pcSid);
    show($('pc-qr'), s.qr !== 'none' && !s.pcConn);
    show($('pc-stamp'), s.qr === 'used');
    show($('pc-conn'), s.pcConn);
    const reveal = b.qrDraw ? ease(p) : s.qr !== 'none' ? 1 : 0;
    const n = Math.round(reveal * qrEls.length);
    qrEls.forEach((el, i) => el.setAttribute('display', i < n ? 'inline' : 'none'));
    const drawP = b.frames ? p : t >= FRAMES_BEAT.t1 ? 1 : 0;
    drawPath.style.strokeDashoffset = drawLen * (1 - drawP);

    // 세션 API 저장소
    show($('v-sid'), s.sid);
    show($('v-token'), s.token !== 'none');
    show($('v-token-ttl'), s.token === 'live');
    show($('v-token-x'), s.token === 'dead');
    show($('v-token-dead'), s.token === 'dead');
    show($('v-key'), s.key);
    show($('v-empty'), !s.sid);
    for (const k of ['sid', 'token', 'key']) $('hl-' + k).classList.toggle('on', !!(b.hl && b.hl.includes(k)));
    $('api-g').classList.toggle('idle', s.apiIdle);
    $('api-note').textContent = s.apiIdle ? '프레임은 여기를 거치지 않음' : '메모리에 저장 · 재시작하면 사라짐';

    // 휴대폰
    const ph = s.phone === 'start' ? 'cam' : s.phone;
    for (const k of ['idle', 'scan', 'load', 'cam', 'live']) show($('ph-' + k), ph === k);
    $('ph-btn').setAttribute('fill', s.phone === 'start' ? 'var(--ok)' : 'var(--screen-ink)');
    $('ph-btn-t').textContent = s.phone === 'start' ? '누름' : '촬영 시작';
    show($('cookie'), s.cookie);
    show($('tunnel'), s.tunnel);
    show($('scan'), !!b.scan && Math.floor(p * 6) % 2 === 0);

    // 강조
    for (const k of ['pc', 'phone', 'nginx', 'api', 'stream']) $('ring-' + k).classList.toggle('on', !!(b.glow && b.glow.includes(k)));

    // 패킷
    pool.forEach((k) => k.g.setAttribute('display', 'none'));
    let sent = 0;
    if (b.move) packet(0, route(b.move), ease(p), b.move.label, b.move.c);
    if (b.frames) {
      const local = t - b.t0;
      const k = Math.floor(local / FRAME.period);
      const f = local - k * FRAME.period;
      sent = k + 1;
      if (f < FRAME.travel) packet(0, R.tun, ease(f / FRAME.travel), `프레임 ${k + 1}`, 'ok');
      else if (f < FRAME.travel + FRAME.ack) packet(1, [...R.tun].reverse(), ease((f - FRAME.travel) / FRAME.ack), 'ack', 'muted');
      $('vision').style.strokeWidth = f >= FRAME.travel && f < FRAME.travel + 0.35 ? '3' : '';
    } else {
      $('vision').style.strokeWidth = '';
      if (t >= FRAMES_BEAT.t1) sent = MAX_FRAMES;
    }
    $('ph-count').textContent = `보낸 프레임 ${sent}`;

    // 자막 (단계가 바뀔 때만 다시 씀)
    if (b !== lastBeat) {
      lastBeat = b;
      const st = STEPS[b.step];
      $('badge').textContent = `${b.step + 1} / ${STEPS.length}`;
      $('step-title').textContent = st.title;
      $('beat').textContent = b.cap;
    }

    // 재생 막대
    $('scrub').value = t / TOTAL;
    $('time').textContent = `${t.toFixed(1)} / ${TOTAL.toFixed(1)}초`;
    STEPS.forEach((st, i) => {
      const prog = Math.max(0, Math.min(1, (t - st.t0) / (st.t1 - st.t0)));
      chips[i].fill.style.width = (prog * 100).toFixed(1) + '%';
      chips[i].btn.toggleAttribute('aria-current', false);
      if (i === b.step) chips[i].btn.setAttribute('aria-current', 'step');
    });
  }

  // ── 단계 버튼 ────────────────────────────────
  const chips = STEPS.map((st, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `<span class="num">${i + 1}</span>${st.name}<span class="fill"></span>`;
    btn.addEventListener('click', () => seek(st.t0));
    li.appendChild(btn);
    $('chips').appendChild(li);
    return { btn, fill: btn.querySelector('.fill') };
  });

  // ── 재생 ─────────────────────────────────────
  let t = 0, playing = false, speed = 1, last = 0;
  const playBtn = $('play');
  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? '❚❚ 일시정지' : t >= TOTAL ? '↺ 다시 보기' : '▶ 재생';
    if (on) { last = performance.now(); requestAnimationFrame(tick); }
  }
  function tick(now) {
    if (!playing) return;
    t = Math.min(TOTAL, t + ((now - last) / 1000) * speed);
    last = now;
    render(t);
    if (t >= TOTAL) { setPlaying(false); return; }
    requestAnimationFrame(tick);
  }
  function seek(nt) {
    t = Math.max(0, Math.min(TOTAL, nt));
    render(t);
    if (!playing) playBtn.textContent = t >= TOTAL ? '↺ 다시 보기' : '▶ 재생';
  }
  const stepIndex = () => stateAt(t).b.step;
  function prev() {
    const i = stepIndex();
    seek(t - STEPS[i].t0 > 0.6 || i === 0 ? STEPS[i].t0 : STEPS[i - 1].t0);
  }
  function next() {
    const i = stepIndex();
    seek(i < STEPS.length - 1 ? STEPS[i + 1].t0 : TOTAL);
  }

  playBtn.addEventListener('click', () => {
    if (playing) return setPlaying(false);
    if (t >= TOTAL) t = 0;
    setPlaying(true);
  });
  $('prev').addEventListener('click', prev);
  $('next').addEventListener('click', next);
  $('scrub').addEventListener('input', (e) => seek(parseFloat(e.target.value) * TOTAL));
  document.querySelectorAll('.speed button').forEach((btn) => {
    btn.addEventListener('click', () => {
      speed = parseFloat(btn.dataset.speed);
      document.querySelectorAll('.speed button').forEach((o) => o.setAttribute('aria-pressed', String(o === btn)));
    });
  });
  document.addEventListener('keydown', (e) => {
    const tag = e.target.tagName;
    if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'INPUT') { e.preventDefault(); playBtn.click(); }
    else if (e.key === 'ArrowLeft' && tag !== 'INPUT') prev();
    else if (e.key === 'ArrowRight' && tag !== 'INPUT') next();
  });

  render(0);
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) setPlaying(true);
})();
</script>
